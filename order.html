<!DOCTYPE html>
<html>

<head>
    <title>Place an Order - ZauberWhisk</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Place an Order</h1>

    <p>Thank you for choosing ZauberWhisk!</p>

    <h2>Your Details</h2>

<form>

    <label for="name">Name:</label>
    <br>
    <input type="text" id="name" name="name">
    <br><br>

    <label for="phone">Phone:</label>
    <br>
    <input type="tel" id="phone" name="phone">
    <br><br>

    <label for="email">Email:</label>
    <br>
    <input type="email" id="email" name="email">
    <br><br>

    
    <h2>Choose Your Products</h2>
    <p>Please enter the quantity you would like for each product.</p>

    <label for="cake">Chocolate Cake - €35</label>
    <br>
    <input type="number" id="cake" name="cake" min="0" value="0">
    <br><br>

    <label for="cookies">Cookies - €12</label>
    <br>
    <input type="number" id="cookies" name="cookies" min="0" value="0">
    <br><br>

    <label for="brownies">Brownies - €15</label>
    <br>
    <input type="number" id="brownies" name="brownies" min="0" value="0">
    <br><br>

    <label for="chocolates">Chocolate Bars - €10</label>
    <br>
    <input type="number" id="chocolates" name="chocolates" min="0" value="0">
    <br><br>

    <h2 id="total">Estimated total: €0</h2>
    <button type="button" onclick="calculateTotal()">Calculate Total</button>
    <br><br>

</form>

    <script src="script.js"></script>
</body>

</html>
