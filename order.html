<!DOCTYPE html>
<html>

<head>
    <title>Place an Order - ZauberWhisk</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Place an Order</h1>

    <p>Thank you for choosing ZauberWhisk!</p>

    <h2>Your Details</h2>

<form>

    <label for="name">Name:</label>
    <br>
    <input type="text" id="name" name="name">
    <br><br>

    <label for="phone">Phone:</label>
    <br>
    <input type="tel" id="phone" name="phone">
    <br><br>

    <label for="email">Email:</label>
    <br>
    <input type="email" id="email" name="email">
    <br><br>
    <h2>Choose Your Products</h2>

    <label for="product">Product:</label>
    <br>

    <select id="product" name="product">

        <option value="">-- Select a product --</option>

        <option value="CAK001">Chocolate Cake - €35</option>

        <option value="COO001">Cookies - €12</option>

        <option value="BRO001">Brownies - €15</option>

        <option value="CHO001">Chocolate Bars - €10</option>

    </select>

    <br><br>

    <label for="quantity">Quantity:</label>
    <br>

    <input type="number" id="quantity" name="quantity" min="1" value="1">

    <br><br>

</form>

</body>

</html>
